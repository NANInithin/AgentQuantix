[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentquantix"
dynamic = ["version"]
description = "Research trending Hugging Face models and quantize the approved ones to llama.cpp GGUF."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["gguf", "llama.cpp", "quantization", "huggingface", "agent", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately small. The MCP server is written against raw JSON-RPC and the
# OpenRouter loop against urllib, so neither the `mcp` nor the `openai` package
# is required - a portability layer that needs a pip install in someone else's
# environment is not portable. These three the pipeline genuinely cannot do
# without.
dependencies = [
    # Floor is a version actually verified, not a guess: 0.30 has neither
    # constants.HF_HUB_DISABLE_XET nor MAX_HTTP_DOWNLOAD_SIZE, so the xet
    # policy would AttributeError on first use. 0.36 and 1.30 are both
    # tested; the API difference between them is handled in hub.py.
    "huggingface_hub>=0.36",
    "datasets>=3.0",
    "gguf>=0.10",
]

[project.optional-dependencies]
# hf_xet lifts huggingface_hub's plain-HTTP download cap (50 decimal GB, which
# is 46.57 GiB). Required for the largest models; the agent enables it only for
# those downloads and keeps uploads on the much faster plain-HTTP path.
big = ["hf_xet>=1.0"]
# Ninja parallelises a build at file level instead of project level, which is
# several times faster for ggml's ~100 CUDA sources.
build = ["ninja>=1.11"]
# convert_hf_to_gguf.py imports torch and transformers. Needed ONLY to
# convert safetensors; a model whose publisher ships a BF16 GGUF needs
# neither, and nor does research. Roughly 1 GB, so opt-in rather than a
# hard dependency -- but without it `aqx run` can only handle models that
# already have an official GGUF.
convert = ["torch>=2.0", "transformers>=4.40", "sentencepiece", "protobuf"]
dev = ["pytest>=8.0"]
all = ["hf_xet>=1.0", "ninja>=1.11"]
# Everything, conversion included. Large.
full = ["hf_xet>=1.0", "ninja>=1.11", "torch>=2.0",
        "transformers>=4.40", "sentencepiece", "protobuf"]

[project.urls]
Documentation = "https://github.com/NANInithin/AgentQuantix/blob/main/USAGE.md"

[project.scripts]
aqx = "agentquantix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentquantix.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
